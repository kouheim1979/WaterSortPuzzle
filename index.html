<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#090d24">
<title>Water Sort Puzzle</title>
<style>
:root{
  --bg0:#070b20;--bg1:#111b46;--bg2:#28134d;
  --panel:rgba(10,15,43,.72);--panelStrong:rgba(13,19,54,.91);
  --line:rgba(180,205,255,.16);--lineStrong:rgba(205,224,255,.32);
  --text:#f5f8ff;--sub:rgba(210,224,255,.62);--gold:#ffd45a;
  --accent:#8c79ff;--accent2:#da65ff;--danger:#ff6b8b;--ok:#5df0ae;
  --dur:300ms;--bw:58px;--bh:148px;--gap:11px;--safe:env(safe-area-inset-bottom,0px);
}
body[data-theme="Blue"]{--bg0:#041426;--bg1:#082f58;--bg2:#0d4958;--accent:#4fb5ff;--accent2:#6de4da}
body[data-theme="Dark"]{--bg0:#05070d;--bg1:#101522;--bg2:#16111e;--accent:#8b92a8;--accent2:#bb86fc;--panel:rgba(5,8,15,.82);--panelStrong:rgba(5,8,15,.95)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif;
  color:var(--text);background:var(--bg0);user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit}
#scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:
  radial-gradient(ellipse 92% 68% at 18% -8%,color-mix(in srgb,var(--accent) 42%,transparent),transparent 62%),
  radial-gradient(ellipse 85% 65% at 92% 105%,color-mix(in srgb,var(--accent2) 35%,transparent),transparent 62%),
  linear-gradient(180deg,var(--bg0),var(--bg1) 56%,var(--bg2))}
#scene::before,#scene::after{
  content:"";position:absolute;border-radius:50%;filter:blur(34px);opacity:.34;
  animation:aurora 13s ease-in-out infinite alternate
}
#scene::before{width:52vw;height:52vw;max-width:280px;max-height:280px;left:-12%;top:22%;background:var(--accent)}
#scene::after{width:46vw;height:46vw;max-width:240px;max-height:240px;right:-10%;bottom:12%;background:var(--accent2);animation-delay:-6s}
@keyframes aurora{to{transform:translate3d(26px,-22px,0) scale(1.14);opacity:.48}}
#stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#dceaff;box-shadow:0 0 8px rgba(190,220,255,.5);animation:twinkle var(--t) ease-in-out infinite;animation-delay:var(--d)}
@keyframes twinkle{0%,100%{opacity:.08;transform:scale(.8)}50%{opacity:.72;transform:scale(1.18)}}

#app{position:relative;z-index:2;width:100%;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
#header{
  flex:none;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:10px 12px 9px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,color-mix(in srgb,var(--panelStrong) 94%,transparent),var(--panel));
  backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2);
  box-shadow:0 12px 32px rgba(0,0,0,.15)
}
.stageBlock{min-width:0}
#stageTitle{font-size:20px;line-height:1.05;font-weight:900;letter-spacing:-.02em}
#difficulty{
  display:inline-flex;margin-top:4px;padding:3px 8px;border-radius:999px;
  font-size:8px;line-height:1;font-weight:900;letter-spacing:.18em;border:1px solid transparent
}
#difficulty.easy{color:#77f5a7;background:rgba(30,210,110,.10);border-color:rgba(70,240,145,.18)}
#difficulty.normal{color:#7ec5ff;background:rgba(70,150,255,.10);border-color:rgba(100,180,255,.18)}
#difficulty.hard{color:#ffc078;background:rgba(255,150,60,.10);border-color:rgba(255,170,80,.18)}
#difficulty.expert{color:#f49cff;background:rgba(230,90,255,.10);border-color:rgba(235,120,255,.18)}
#coinPill{
  display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:15px;
  color:var(--gold);font-weight:900;background:linear-gradient(180deg,rgba(255,205,80,.12),rgba(255,175,40,.06));
  border:1px solid rgba(255,205,90,.28);box-shadow:inset 0 1px rgba(255,255,255,.08)
}
.coinIcon{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff8c1,#ffd250 42%,#d99313 76%);box-shadow:inset 0 -2px 3px rgba(120,65,0,.35),0 0 10px rgba(255,205,70,.25)}
#settingsBtn{
  width:40px;height:40px;border-radius:14px;border:1px solid var(--lineStrong);
  color:var(--text);font-size:18px;background:rgba(255,255,255,.065);cursor:pointer;
  box-shadow:inset 0 1px rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.15);
  transition:transform .16s ease,background .2s ease
}
#settingsBtn:active{transform:scale(.9) rotate(30deg);background:rgba(255,255,255,.13)}

#game{
  flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;
  display:flex;align-items:center;justify-content:center;padding:12px 8px 14px
}
#game.stage-enter{animation:stageEnter .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes stageEnter{from{opacity:0;transform:translateY(10px) scale(.98);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
#grid{
  width:100%;display:grid;grid-template-columns:repeat(var(--cols,3),var(--bw));
  justify-content:center;align-items:end;gap:var(--gap);padding:8px 4px 2px
}
#grid.compact{--bh:136px;--bw:54px;--gap:9px}
#grid.dense{--bh:124px;--bw:50px;--gap:8px}

.bottle{
  position:relative;width:var(--bw);height:calc(var(--bh) + 22px);border:0;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:inherit;cursor:pointer;
  transform-origin:50% 78%;transition:transform var(--dur) cubic-bezier(.2,.8,.2,1),filter var(--dur) ease;
  filter:drop-shadow(0 12px 12px rgba(0,0,0,.28))
}
.bottle::before{
  content:"";position:absolute;z-index:-1;left:50%;bottom:4px;width:72%;height:10px;transform:translateX(-50%);
  border-radius:50%;background:rgba(0,0,0,.24);filter:blur(6px);transition:all var(--dur)
}
.bottle.selected{transform:translateY(-14px) scale(1.055);filter:drop-shadow(0 18px 17px rgba(0,0,0,.30)) drop-shadow(0 0 18px rgba(205,220,255,.18))}
.bottle.selected::before{width:88%;opacity:.58}
.bottle.done{filter:drop-shadow(0 12px 12px rgba(0,0,0,.26)) drop-shadow(0 0 12px var(--glow))}
.bottle.hint-from,.bottle.hint-to{animation:hintPulse .68s ease-in-out infinite alternate}
.bottle.hint-from::after,.bottle.hint-to::after{
  position:absolute;top:-4px;z-index:12;padding:3px 5px;border-radius:7px;font-size:7px;font-weight:1000;letter-spacing:.08em;
  background:rgba(255,232,80,.94);color:#362a00;box-shadow:0 4px 14px rgba(255,220,50,.25)
}
.bottle.hint-from::after{content:"FROM"}.bottle.hint-to::after{content:"TO"}
@keyframes hintPulse{to{transform:translateY(-9px) scale(1.06);filter:brightness(1.28) drop-shadow(0 0 18px rgba(255,230,70,.7))}}
.bottle.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-8px) rotate(-4deg)}36%{transform:translateX(8px) rotate(4deg)}54%{transform:translateX(-6px) rotate(-3deg)}72%{transform:translateX(5px) rotate(2deg)}86%{transform:translateX(-2px)}}
.bottle.pouring{
  z-index:30;animation:pourTravel var(--dur) cubic-bezier(.25,.72,.2,1) both;
  filter:drop-shadow(0 18px 20px rgba(0,0,0,.42))
}
@keyframes pourTravel{
  0%{transform:translate(0,0) rotate(0) scale(1)}
  20%{transform:translate(0,-12px) rotate(0) scale(1.03)}
  52%{transform:translate(var(--px),var(--py)) rotate(var(--tilt)) scale(1.04)}
  76%{transform:translate(var(--px),var(--py)) rotate(var(--tilt)) scale(1.04)}
  100%{transform:translate(0,0) rotate(0) scale(1)}
}
.bottle.receiving .vessel{animation:receivePulse var(--dur) ease}
@keyframes receivePulse{35%,72%{box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 28px rgba(135,180,255,.35),inset -8px 0 20px rgba(0,0,0,.2)}}
.neck{
  width:68%;height:13px;flex:none;position:relative;z-index:5;
  border:2px solid rgba(220,235,255,.48);border-bottom:0;border-radius:8px 8px 0 0;
  background:linear-gradient(90deg,rgba(255,255,255,.13),rgba(255,255,255,.03) 44%,rgba(255,255,255,.15));
  box-shadow:inset 0 1px rgba(255,255,255,.2)
}
.neck::after{content:"";position:absolute;left:4px;right:4px;top:3px;height:2px;border-radius:3px;background:rgba(255,255,255,.22)}
.vessel{
  width:100%;height:var(--bh);position:relative;overflow:hidden;border-radius:4px 4px 18px 18px;
  border:1.8px solid rgba(205,226,255,.34);border-top-color:rgba(205,226,255,.22);
  background:linear-gradient(90deg,rgba(110,150,255,.07),rgba(255,255,255,.02) 45%,rgba(95,120,225,.06));
  box-shadow:inset -8px 0 20px rgba(0,0,0,.22),inset 0 -12px 18px rgba(0,0,0,.18),inset 6px 0 12px rgba(255,255,255,.025);
  transition:border-color var(--dur),box-shadow var(--dur)
}
.selected .vessel{border-color:rgba(238,246,255,.72);box-shadow:0 0 0 1px rgba(255,255,255,.16),0 0 22px rgba(180,210,255,.13),inset -8px 0 20px rgba(0,0,0,.22)}
.levelLines{position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),rgba(255,255,255,.045) calc(25% - 1px),rgba(255,255,255,.045) 25%)}
.liquid{position:absolute;inset:4px 3px 3px;z-index:2;overflow:hidden;border-radius:2px 2px 14px 14px}
.water{
  position:absolute;left:0;right:0;bottom:calc(var(--i) * 25%);height:25%;
  background:linear-gradient(180deg,var(--c1),var(--c2));
  box-shadow:inset 0 7px 9px rgba(255,255,255,.15),inset 0 -8px 10px rgba(0,0,0,.13);
  animation:waterSettle var(--dur) cubic-bezier(.2,.8,.2,1) both
}
.water+.water{border-bottom:1px solid rgba(0,0,0,.16)}
.water.surface::before{
  content:"";position:absolute;left:-4%;right:-4%;top:-3px;height:7px;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.40),rgba(255,255,255,.05) 55%,rgba(0,0,0,.08));
  opacity:.8;animation:surfaceWave 2.8s ease-in-out infinite alternate
}
@keyframes surfaceWave{to{transform:translateX(4%) scaleY(.72);opacity:.62}}
@keyframes waterSettle{from{transform:translateY(8px);opacity:.35}to{transform:none;opacity:1}}
.glass{
  position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:inherit;
  background:linear-gradient(90deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,.09) 10%,transparent 25%,transparent 68%,rgba(0,0,0,.16) 100%)
}
.glass::before{content:"";position:absolute;top:8px;left:7px;width:8px;height:66%;border-radius:99px;background:linear-gradient(rgba(255,255,255,.46),rgba(255,255,255,.06),transparent)}
.glass::after{content:"";position:absolute;left:16%;right:16%;bottom:5px;height:7px;border-radius:50%;background:rgba(255,255,255,.06)}
.bottleNum{position:absolute;bottom:-1px;font-size:8px;font-weight:800;color:rgba(205,220,255,.30)}

.pour-stream{
  position:fixed;z-index:100;width:5px;height:54px;border-radius:999px;pointer-events:none;
  transform-origin:50% 0;background:linear-gradient(180deg,var(--stream1),var(--stream2));
  box-shadow:0 0 8px var(--stream1);opacity:0;filter:saturate(1.15);
  animation:stream var(--streamDur) ease-in-out both
}
@keyframes stream{0%,18%,92%,100%{opacity:0;transform:translateY(-4px) rotate(var(--sr)) scaleY(.35)}35%,75%{opacity:.92;transform:translateY(0) rotate(var(--sr)) scaleY(1)}}

#footer{
  flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;
  padding:9px 10px calc(9px + var(--safe));border-top:1px solid var(--line);
  background:linear-gradient(0deg,color-mix(in srgb,var(--panelStrong) 96%,transparent),var(--panel));
  backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2)
}
.action{
  position:relative;min-width:0;min-height:58px;border:1px solid rgba(215,228,255,.17);border-radius:18px;
  color:var(--text);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));
  box-shadow:inset 0 1px rgba(255,255,255,.07),0 7px 18px rgba(0,0,0,.10);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .14s ease,background .18s ease,border-color .18s ease,opacity .18s ease
}
.action:active{transform:translateY(2px) scale(.94);background:rgba(255,255,255,.12)}
.action:disabled{opacity:.28;pointer-events:none}
.action .ico{font-size:20px;line-height:1}.action .lbl{font-size:9px;font-weight:800;color:var(--sub)}
.action .cost{font-size:7px;font-weight:800;color:rgba(255,214,90,.7)}
.action.special{border-color:rgba(170,135,255,.26);background:linear-gradient(180deg,rgba(142,112,255,.14),rgba(121,73,235,.07))}

.modalBack{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;
  background:rgba(2,4,12,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:1;transition:opacity .22s
}
.modalBack.hidden{display:none}
.card{
  width:min(350px,100%);border-radius:27px;padding:24px 20px;
  background:linear-gradient(180deg,rgba(18,24,61,.97),rgba(7,11,32,.98));
  border:1px solid rgba(190,210,255,.20);box-shadow:0 28px 80px rgba(0,0,0,.46),inset 0 1px rgba(255,255,255,.06);
  animation:modalIn .34s cubic-bezier(.2,.9,.2,1.1) both
}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
.clearCard{text-align:center}.clearIcon{font-size:58px;animation:clearPop .65s cubic-bezier(.25,1.5,.4,1) .08s both}
@keyframes clearPop{from{opacity:0;transform:scale(.3) rotate(-18deg)}to{opacity:1;transform:none}}
.clearTitle{font-size:29px;font-weight:1000;letter-spacing:-.03em;margin:5px 0 7px;background:linear-gradient(120deg,#fff,#a9e5ff,#f1a8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#rewardText{font-size:18px;font-weight:900;color:var(--gold)}#totalText{margin:6px 0 20px;color:var(--sub);font-size:12px}
.primary{
  width:100%;padding:14px 16px;border:0;border-radius:15px;color:white;font-weight:900;font-size:15px;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 30%,transparent)
}
.settingsTitle{text-align:center;font-size:18px;font-weight:900;margin-bottom:13px}
.settingRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.065)}
.settingRow .label{font-size:12px;font-weight:700;color:var(--sub)}
.toggle,.choice,.ghost{
  border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.055);color:var(--sub);
  padding:6px 10px;font-size:10px;font-weight:800;cursor:pointer
}
.toggle.on,.choice.on{background:color-mix(in srgb,var(--accent) 32%,transparent);border-color:color-mix(in srgb,var(--accent) 58%,transparent);color:#fff}
.choiceGroup{display:flex;gap:4px}.settingsActions{display:grid;gap:7px;margin-top:16px}.ghost{padding:11px;width:100%;color:var(--text)}.ghost.danger{color:#ffacba;border-color:rgba(255,100,130,.26);background:rgba(255,70,100,.055)}

#toast{
  position:fixed;z-index:180;left:50%;bottom:calc(82px + var(--safe));transform:translateX(-50%) translateY(15px);
  padding:9px 13px;border-radius:999px;background:rgba(6,9,24,.88);border:1px solid rgba(255,255,255,.11);
  color:#fff;font-size:11px;font-weight:800;box-shadow:0 10px 28px rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;z-index:250;overflow:hidden;pointer-events:none}
.conf{position:absolute;top:-20px;width:var(--w);height:var(--h);border-radius:var(--r);background:var(--cc);animation:confetti var(--ct) linear forwards}
@keyframes confetti{to{transform:translate3d(var(--drift),112vh,0) rotate(850deg);opacity:.15}}

@media(max-width:350px){
  :root{--bw:52px;--bh:132px;--gap:8px}
  #grid.compact{--bw:49px;--bh:122px;--gap:7px}#grid.dense{--bw:46px;--bh:113px;--gap:6px}
  #header{padding-left:9px;padding-right:9px;gap:7px}.action{min-height:54px}.action .ico{font-size:18px}
}
@media(min-width:560px){
  #app{max-width:640px}#grid{--bw:64px;--bh:166px;--gap:15px}#grid.compact,#grid.dense{--bw:60px;--bh:154px;--gap:13px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body data-theme="Purple">
<div id="scene"></div><div id="stars"></div>
<div id="app">
  <header id="header">
    <div class="stageBlock"><div id="stageTitle">Stage 1</div><div id="difficulty" class="easy">EASY</div></div>
    <div id="coinPill"><span class="coinIcon"></span><span id="coinValue">100</span></div>
    <button id="settingsBtn" aria-label="設定">⚙️</button>
  </header>
  <main id="game"><div id="grid"></div></main>
  <footer id="footer">
    <button id="undoBtn" class="action"><span class="ico">↩</span><span class="lbl">Undo</span></button>
    <button id="restartBtn" class="action"><span class="ico">↺</span><span class="lbl">Restart</span></button>
    <button id="hintBtn" class="action special"><span class="ico">💡</span><span class="lbl">Hint</span><span class="cost">-10 🪙</span></button>
    <button id="extraBtn" class="action special"><span class="ico">🧪</span><span class="lbl">+Bottle</span><span class="cost">-20 🪙</span></button>
  </footer>
</div>
<div id="toast"></div><div id="confetti"></div>
<div id="clearModal" class="modalBack hidden">
  <div class="card clearCard">
    <div class="clearIcon">🎉</div><div class="clearTitle">Complete!</div>
    <div id="rewardText">+20 コイン</div><div id="totalText">合計: 120 🪙</div>
    <button id="nextBtn" class="primary">Next Stage →</button>
  </div>
</div>
<div id="settingsModal" class="modalBack hidden">
  <div class="card">
    <div class="settingsTitle">⚙️ Settings</div>
    <div class="settingRow"><span class="label">🔊 サウンド</span><button id="soundBtn" class="toggle on">ON</button></div>
    <div class="settingRow"><span class="label">📳 バイブ</span><button id="vibBtn" class="toggle on">ON</button></div>
    <div class="settingRow"><span class="label">🎨 テーマ</span><div id="themeGroup" class="choiceGroup"><button class="choice" data-v="Purple">Purple</button><button class="choice" data-v="Blue">Blue</button><button class="choice" data-v="Dark">Dark</button></div></div>
    <div class="settingRow"><span class="label">⚡ 速度</span><div id="speedGroup" class="choiceGroup"><button class="choice" data-v="Slow">Slow</button><button class="choice" data-v="Normal">Normal</button><button class="choice" data-v="Fast">Fast</button></div></div>
    <div class="settingsActions"><button id="randomBtn" class="ghost">🎲 ランダムステージ</button><button id="resetBtn" class="ghost danger">🗑️ データ初期化</button><button id="closeSettingsBtn" class="ghost">閉じる</button></div>
  </div>
</div>
<script>
(()=>{'use strict';

const K=Object.freeze({
  CAP:4,INITIAL_COINS:100,CLEAR_REWARD:20,CAMPAIGN_BONUS:100,HINT_COST:10,EXTRA_COST:20,MAX_EXTRA:3,
  SAVE_VERSION:3,SAVE_KEY:'watersort_game_v3',SETTINGS_KEY:'watersort_settings_v3',
  SPEED:Object.freeze({Slow:480,Normal:300,Fast:150}),
  COLORS:Object.freeze(['red','blue','green','yellow','orange','cyan','purple','pink','gray','brown']),
  STYLE:Object.freeze({
    red:['#ff565f','#bf1425','#ff686f'],blue:['#4678ff','#1642c8','#6692ff'],green:['#43e977','#0a963b','#62f195'],
    yellow:['#ffe962','#caa817','#fff07d'],orange:['#ff9a3c','#d95a13','#ffb15e'],cyan:['#42dfeb','#079cae','#63edf6'],
    purple:['#b56cff','#7624d1','#cc8aff'],pink:['#ff69a8','#c51f69','#ff87bc'],gray:['#a7b4ca','#637089','#c0cbdc'],brown:['#bb855a','#76482a','#d39b72']
  }),
  DIFF:Object.freeze({
    easy:Object.freeze({colors:4,empty:2,target:18,minMixed:3}),
    normal:Object.freeze({colors:6,empty:2,target:28,minMixed:5}),
    hard:Object.freeze({colors:8,empty:2,target:38,minMixed:6}),
    expert:Object.freeze({colors:10,empty:3,target:50,minMixed:8})

const FIXED_SEEDS=Object.freeze([42,137,256,512,1337,2048,3141,6283,9999,12345,54321,99999,11111,22222,33333,44444,55555,66666,77777,88888]);

class RNG{

class Bottle{
  constructor(segments=[]){this._s=Array.isArray(segments)?[...segments]:[]}
  get segments(){return[...this._s]} get length(){return this._s.length} get empty(){return this._s.length===0}
  get full(){return this._s.length>=K.CAP} get free(){return K.CAP-this._s.length} get top(){return this.empty?null:this._s[this._s.length-1]}
  get run(){if(this.empty)return 0;let n=0,t=this.top;for(let i=this._s.length-1;i>=0&&this._s[i]===t;i--)n++;return n}
  get complete(){return this.empty||(this._s.length===K.CAP&&this._s.every(c=>c===this._s[0]))}
  canPourTo(target){return target instanceof Bottle&&!this.empty&&!target.full&&(target.empty||target.top===this.top)}
  take(n){return this._s.splice(this._s.length-n,n)} give(a){this._s.push(...a)} clone(){return new Bottle(this._s)} toJSON(){return[...this._s]}
}

class StageManager{
  static difficulty(level){if(level<=5)return'easy';if(level<=10)return'normal';if(level<=15)return'hard';if(level<=20)return'expert';return['easy','normal','hard','expert'][Math.floor((level-21)/5)%4]}
  static label(d){return({easy:'EASY',normal:'NORMAL',hard:'HARD',expert:'EXPERT'})[d]||'EASY'}
  static config(d){return K.DIFF[d]||K.DIFF.easy}
  static key(b){return b.map(x=>x.join('.')).join('|')}
  static run(x){if(!x.length)return 0;let n=0,t=x[x.length-1];for(let i=x.length-1;i>=0&&x[i]===t;i--)n++;return n}
  static solved(b){return b.every(x=>!x.length||(x.length===K.CAP&&x.every(c=>c===x[0])))}
  static mixed(b){return b.filter(x=>new Set(x).size>1).length}
  static canMove(b,f,t){return f!==t&&b[f]?.length>0&&b[t]?.length<K.CAP&&(!b[t].length||b[t][b[t].length-1]===b[f][b[f].length-1])}
  static moveArray(b,f,t){if(!this.canMove(b,f,t))return 0;const n=Math.min(this.run(b[f]),K.CAP-b[t].length);b[t].push(...b[f].splice(b[f].length-n,n));return n}
  static validate(stage){
    try{
      const d=stage.difficulty,cfg=this.config(d),b=stage.bottles;
      if(!Array.isArray(b)||b.length!==cfg.colors+cfg.empty)return{ok:false,reason:'bottle count'};
      if(b.filter(x=>Array.isArray(x)&&x.length===0).length!==cfg.empty)return{ok:false,reason:'empty count'};
      const allowed=K.COLORS.slice(0,cfg.colors),counts=Object.fromEntries(allowed.map(c=>[c,0]));
      for(const x of b){if(!Array.isArray(x)||x.length>K.CAP)return{ok:false,reason:'capacity'};for(const c of x){if(!allowed.includes(c))return{ok:false,reason:'color'};counts[c]++}}
      if(allowed.some(c=>counts[c]!==K.CAP))return{ok:false,reason:'color count'};
      if(this.solved(b))return{ok:false,reason:'already solved'};
      if(Array.isArray(stage.solution)){const cur=b.map(x=>[...x]);for(const m of stage.solution){if(!this.canMove(cur,m.from,m.to))return{ok:false,reason:'solution illegal'};const n=this.moveArray(cur,m.from,m.to);if(n!==m.count)return{ok:false,reason:'solution count'}}if(!this.solved(cur))return{ok:false,reason:'solution incomplete'}}
      return{ok:true}
    }catch(e){return{ok:false,reason:String(e)}}
  }
  static validateAllFixedStages(){let ok=true;FIXED_SEEDS.forEach((seed,i)=>{const level=i+1,d=this.difficulty(level),stage=this.buildRandom(d,seed),v=stage?this.validate(stage):{ok:false,reason:'generation failed'};if(!v.ok){ok=false;console.error('Invalid fixed stage:',level,v.reason)}});if(ok)console.info('All fixed stages validated successfully.');return ok}
  static buildRandom(diff,seed){
    const cfg=this.config(diff),master=new RNG(seed);let best=null;
    for(let trial=0;trial<36;trial++){
      const rng=new RNG((seed+master.int(0x7fffffff)+trial*3571)>>>0);
      let b=K.COLORS.slice(0,cfg.colors).map(c=>Array(K.CAP).fill(c));for(let i=0;i<cfg.empty;i++)b.push([]);
      const steps=[],seen=new Set([this.key(b)]);let prev=null;const max=cfg.target*2+18;
      for(let s=0;s<max;s++){
        const opts=[];
        for(let fi=0;fi<b.length;fi++){
          const src=b[fi];if(!src.length)continue;const color=src[src.length-1],run=this.run(src);
          for(let ti=0;ti<b.length;ti++){
            const dst=b[ti];if(fi===ti||dst.length>=K.CAP)continue;if(dst.length&&dst[dst.length-1]===color)continue;
            const mm=Math.min(run,K.CAP-dst.length);
            for(let count=1;count<=mm;count++){
              const remain=src.slice(0,-count);if(remain.length&&remain[remain.length-1]!==color)continue;
              if(prev&&prev.fi===ti&&prev.ti===fi&&prev.count===count)continue;
              const nb=b.map(x=>[...x]);nb[ti].push(...nb[fi].splice(nb[fi].length-count,count));const key=this.key(nb);if(seen.has(key))continue;
              const score=this.mixed(nb)*3+(dst.length?5:0)+rng.next()*7;opts.push({fi,ti,count,nb,key,score});
            }
          }
        }
        if(!opts.length)break;opts.sort((a,z)=>z.score-a.score);const pick=opts[rng.int(Math.min(5,opts.length))];b=pick.nb;seen.add(pick.key);steps.push({fi:pick.fi,ti:pick.ti,count:pick.count});prev=pick;
        if(b.filter(x=>!x.length).length===cfg.empty&&!this.solved(b)&&this.mixed(b)>=cfg.minMixed){
          const solution=[...steps].reverse().map(m=>({from:m.ti,to:m.fi,count:m.count}));const candidate={difficulty:diff,bottles:b.map(x=>[...x]),solution};
          const v=this.validate(candidate);if(v.ok){const spread=K.COLORS.slice(0,cfg.colors).reduce((n,c)=>n+b.filter(x=>x.includes(c)).length,0),score=this.mixed(b)*20+spread*2+Math.min(steps.length,cfg.target);if(!best||score>best.score)best={...candidate,score}
        }
      }
    }
    return best
  }
  load(level){
    const diff=StageManager.difficulty(level);
    if(level>=1&&level<=20){
      const stage=StageManager.buildRandom(diff,FIXED_SEEDS[level-1]);
      if(!stage||!StageManager.validate(stage).ok)throw new Error(`Fixed stage ${level} generation failed`);
      return{...stage,level}
    }
    const seed=((Date.now()&0x7fffffff)^(level*7919))>>>0;
    for(let a=0;a<8;a++){const stage=StageManager.buildRandom(diff,(seed+a*9973)>>>0);if(stage&&StageManager.validate(stage).ok)return{...stage,level}}
    const baseSeed=FIXED_SEEDS[({easy:0,normal:5,hard:10,expert:15})[diff]??0],fallback=StageManager.buildRandom(diff,baseSeed);
    if(!fallback)throw new Error('Fallback stage generation failed');
    return{...fallback,level}
  }
  random(diff){
    const seed=(Date.now()^(Math.random()*0x7fffffff))>>>0;
    for(let a=0;a<10;a++){const stage=StageManager.buildRandom(diff,(seed+a*13337)>>>0);if(stage&&StageManager.validate(stage).ok)return stage}
    const baseSeed=FIXED_SEEDS[({easy:0,normal:5,hard:10,expert:15})[diff]??0];
    return StageManager.buildRandom(diff,baseSeed)
  }
}

class GameState{
  constructor(stage,options={}){
    this.level=stage.level||1;this.difficulty=stage.difficulty||StageManager.difficulty(this.level);
    this.coins=Number.isInteger(options.coins)?options.coins:K.INITIAL_COINS;
    this.bottles=(stage.bottles||[]).map(x=>new Bottle(x));this.initialBottles=(stage.initialBottles||stage.bottles||[]).map(x=>new Bottle(x));
    this.extraCount=options.extraCount||0;this.history=[];this.selected=null;this.stageCleared=Boolean(options.stageCleared);
    this.completedStages=new Set(Array.isArray(options.completedStages)?options.completedStages:[]);this.campaignBonusClaimed=Boolean(options.campaignBonusClaimed);this.lastMove=null
  }
  snapshot(){return{bottles:this.bottles.map(b=>b.toJSON()),coins:this.coins,extraCount:this.extraCount,stageCleared:this.stageCleared}}
  pushHistory(){this.history.push(structuredClone(this.snapshot()));if(this.history.length>150)this.history.shift()}
  restore(s){this.bottles=s.bottles.map(x=>new Bottle(x));this.coins=s.coins;this.extraCount=s.extraCount;this.stageCleared=Boolean(s.stageCleared);this.selected=null}
  undo(){const s=this.history.pop();if(!s)return false;this.restore(s);this.lastMove=null;return true}
  restart(){this.bottles=this.initialBottles.map(b=>b.clone());this.extraCount=0;this.history=[];this.selected=null;this.stageCleared=false;this.lastMove=null}
  canMove(f,t){return f!==t&&this.bottles[f]&&this.bottles[t]&&this.bottles[f].canPourTo(this.bottles[t])}
  move(f,t){if(!this.canMove(f,t))return false;this.pushHistory();const source=this.bottles[f],target=this.bottles[t],n=Math.min(source.run,target.free);target.give(source.take(n));this.selected=null;this.lastMove={from:f,to:t};return true}
  addExtra(){if(this.extraCount>=K.MAX_EXTRA)return{ok:false,msg:'追加ビンは最大3本です'};if(this.coins<K.EXTRA_COST)return{ok:false,msg:'コインが足りません'};this.pushHistory();this.coins-=K.EXTRA_COST;this.bottles.push(new Bottle());this.extraCount++;this.selected=null;return{ok:true}}
  useHint(){if(this.coins<K.HINT_COST)return false;this.pushHistory();this.coins-=K.HINT_COST;this.selected=null;return true}
  get clear(){return this.bottles.length>0&&this.bottles.every(b=>b.complete)}
  toJSON(){return{version:K.SAVE_VERSION,level:this.level,difficulty:this.difficulty,coins:this.coins,bottles:this.bottles.map(b=>b.toJSON()),initialBottles:this.initialBottles.map(b=>b.toJSON()),extraCount:this.extraCount,completedStages:[...this.completedStages],campaignBonusClaimed:this.campaignBonusClaimed,stageCleared:this.stageCleared}}
  static fromSaved(d){
    if(!d||![2,K.SAVE_VERSION].includes(d.version)||!Number.isInteger(d.level)||d.level<1||!Number.isFinite(d.coins)||d.coins<0||!Array.isArray(d.bottles))throw new Error('invalid save');
    const legacy=d.version===2,initial=legacy?d.initial:d.initialBottles;if(!Array.isArray(initial))throw new Error('invalid initial board');
    const diff=['easy','normal','hard','expert'].includes(d.difficulty)?d.difficulty:StageManager.difficulty(d.level),cfg=StageManager.config(diff),allowed=K.COLORS.slice(0,cfg.colors);
    const validCurrent=a=>Array.isArray(a)&&a.length>=cfg.colors+cfg.empty&&a.length<=cfg.colors+cfg.empty+K.MAX_EXTRA&&a.every(x=>Array.isArray(x)&&x.length<=K.CAP&&x.every(c=>allowed.includes(c)));
    const validInitial=a=>Array.isArray(a)&&a.length===cfg.colors+cfg.empty&&a.every(x=>Array.isArray(x)&&x.length<=K.CAP&&x.every(c=>allowed.includes(c)));
    if(!validCurrent(d.bottles)||!validInitial(initial))throw new Error('invalid board');
    const completed=legacy?Array.from({length:Math.max(0,d.level-1)},(_,i)=>i+1):(Array.isArray(d.completedStages)?d.completedStages:[]);
    return new GameState({level:d.level,difficulty:diff,bottles:d.bottles,initialBottles:initial},{coins:Math.floor(d.coins),extraCount:Math.max(0,Math.min(K.MAX_EXTRA,d.extraCount||0)),completedStages:completed,campaignBonusClaimed:d.campaignBonusClaimed,stageCleared:legacy?Boolean(d.rewardGranted):Boolean(d.stageCleared)});
  }
}

class HintManager{
  find(g){
    let best=null,bestScore=-Infinity;
    for(let f=0;f<g.bottles.length;f++){
      const s=g.bottles[f];if(s.empty||(!s.empty&&s.complete))continue;
      for(let t=0;t<g.bottles.length;t++){
        if(f===t)continue;const d=g.bottles[t];if(!s.canPourTo(d))continue;
        const n=Math.min(s.run,d.free);if(!n)continue;if(d.empty&&s.run===s.length)continue;
        let score=0;if(d.length+n===K.CAP)score+=100;if(!d.empty)score+=35+n*4;if(s.length-n===0)score+=22;if(s.length>n&&s._s[s.length-n-1]!==s.top)score+=16;if(d.empty)score+=4;
        if(g.lastMove&&g.lastMove.from===t&&g.lastMove.to===f)score-=80;
        if(score>bestScore){bestScore=score;best={from:f,to:t}}
      }
    }return best
  }
}

class AnimationManager{
  constructor(settings){this.settings=settings}
  wait(ms){return new Promise(r=>setTimeout(r,ms))}
  async shake(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');await this.wait(430);el.classList.remove('shake')}
  async pour(fromEl,toEl,color){
    if(!fromEl||!toEl)return;const fr=fromEl.getBoundingClientRect(),tr=toEl.getBoundingClientRect(),dir=(tr.left+tr.width/2)>=(fr.left+fr.width/2)?1:-1;
    const dx=(tr.left+tr.width/2)-(fr.left+fr.width/2)-dir*36,dy=(tr.top-fr.top)-18;
    fromEl.style.setProperty('--px',`${dx}px`);fromEl.style.setProperty('--py',`${dy}px`);fromEl.style.setProperty('--tilt',`${dir*68}deg`);

    const ms=this.settings.ms,streamDelay=Math.max(45,ms*.43);setTimeout(()=>this.stream(tr,color,dir,Math.max(120,ms*.45)),streamDelay);

  }

    setTimeout(()=>wrap.innerHTML='',4300)
  }

class App{

    this.bind();this.renderer.settingsUI();this.renderer.render(this.state);this.anim.stageEnter()
  }
  makeStars(){const e=document.getElementById('stars');e.innerHTML='';for(let i=0;i<55;i++){const s=document.createElement('i');s.className='star';s.style.left=`${Math.random()*100}%`;s.style.top=`${Math.random()*100}%`;s.style.setProperty('--s',`${.7+Math.random()*1.9}px`);s.style.setProperty('--t',`${3+Math.random()*6}s`);s.style.setProperty('--d',`${Math.random()*-6}s`);e.appendChild(s)}}
  bind(){
    document.getElementById('grid').addEventListener('click',e=>{const b=e.target.closest('.bottle');if(b)this.tap(+b.dataset.i)});
    const on=(id,fn)=>document.getElementById(id).addEventListener('click',fn);
    on('undoBtn',()=>this.undo());on('restartBtn',()=>this.restart());on('hintBtn',()=>this.hint());on('extraBtn',()=>this.extra());on('settingsBtn',()=>this.openSettings());on('closeSettingsBtn',()=>this.closeSettings());on('nextBtn',()=>this.next());on('randomBtn',()=>this.random());on('resetBtn',()=>this.reset());
    on('soundBtn',()=>{this.settings.set('sound',!this.settings.values.sound);this.renderer.settingsUI()});on('vibBtn',()=>{this.settings.set('vibration',!this.settings.values.vibration);this.renderer.settingsUI()});
    document.querySelectorAll('#themeGroup .choice').forEach(b=>b.addEventListener('click',()=>{this.settings.set('theme',b.dataset.v);this.renderer.settingsUI()}));
    document.querySelectorAll('#speedGroup .choice').forEach(b=>b.addEventListener('click',()=>{this.settings.set('speed',b.dataset.v);this.renderer.settingsUI()}));
    document.getElementById('settingsModal').addEventListener('click',e=>{if(e.target.id==='settingsModal')this.closeSettings()})
  }
  save(){this.storage.save(this.state)}
  async tap(i){
    if(this.busy||!this.state.bottles[i])return;this.renderer.clearHint();
    if(this.state.selected===null){if(this.state.bottles[i].empty){this.sound.play('fail');await this.anim.shake(this.renderer.el(i));return}this.state.selected=i;this.sound.play('select');this.sound.vibrate(12);this.renderer.render(this.state);return}
    const from=this.state.selected;if(from===i){this.state.selected=null;this.sound.play('select');this.renderer.render(this.state);return}
    if(!this.state.canMove(from,i)){this.sound.play('fail');this.sound.vibrate([28,18,28]);await this.anim.shake(this.renderer.el(i));return}
    const fromEl=this.renderer.el(from),toEl=this.renderer.el(i),color=this.state.bottles[from].top;this.state.move(from,i);this.busy=true;this.sound.play('pour');this.sound.vibrate(20);await this.anim.pour(fromEl,toEl,color);this.busy=false;this.renderer.render(this.state);this.save();this.checkWin()
  }
  undo(){if(this.busy)return;if(!this.state.undo()){this.renderer.toast('戻れる手がありません');return}this.sound.play('select');this.renderer.render(this.state);this.save()}
  restart(){if(this.busy)return;this.state.restart();this.sound.play('select');this.renderer.render(this.state);this.anim.stageEnter();this.save()}
  hint(){if(this.busy)return;const h=this.hints.find(this.state);if(!h){this.sound.play('fail');this.renderer.toast(this.state.coins<K.HINT_COST?'コインが足りません':'ヒントが見つかりません');return}if(!this.state.useHint())return;this.sound.play('coin');this.renderer.render(this.state);this.renderer.hint(h.from,h.to);this.save()}
  extra(){if(this.busy)return;const r=this.state.addExtra();if(!r.ok){this.sound.play('fail');this.renderer.toast(r.msg);return}this.sound.play('coin');this.renderer.render(this.state);this.save()}
  checkWin(){
    if(!this.state.clear||this.state.stageCleared)return;this.state.stageCleared=true;let reward=0;
    if(!this.state.completedStages.has(this.state.level)){this.state.completedStages.add(this.state.level);reward+=K.CLEAR_REWARD;if(this.state.level===20&&!this.state.campaignBonusClaimed){this.state.campaignBonusClaimed=true;reward+=K.CAMPAIGN_BONUS}}
    this.state.coins+=reward;this.sound.play('clear');this.sound.vibrate([70,35,70,35,140]);this.anim.confetti();this.save();setTimeout(()=>this.renderer.showClear(reward,this.state.coins),420)
  }
  next(){this.renderer.hideClear();const stage=new StageManager().load(this.state.level+1),coins=this.state.coins,completed=[...this.state.completedStages],bonus=this.state.campaignBonusClaimed;this.state=new GameState(stage,{coins,completedStages:completed,campaignBonusClaimed:bonus});this.renderer.render(this.state);this.anim.stageEnter();this.save()}
  random(){this.closeSettings();const diff=this.state.difficulty,stage=new StageManager().random(diff);stage.level=this.state.level;const coins=this.state.coins,completed=[...this.state.completedStages],bonus=this.state.campaignBonusClaimed;this.state=new GameState(stage,{coins,completedStages:completed,campaignBonusClaimed:bonus});this.renderer.render(this.state);this.anim.stageEnter();this.save()}
  openSettings(){this.renderer.settingsUI();document.getElementById('settingsModal').classList.remove('hidden');this.sound.play('select')}
  closeSettings(){document.getElementById('settingsModal').classList.add('hidden')}
  reset(){if(!confirm('保存データと設定をすべて初期化しますか？'))return;this.storage.clearAll();this.settings.reset();const st=new StageManager().load(1);this.state=new GameState(st);this.closeSettings();this.renderer.settingsUI();this.renderer.render(this.state);this.anim.stageEnter();this.save()}
}
document.addEventListener('DOMContentLoaded',()=>new App().init(),{once:true});
})();
</script>
</body>
</html>
