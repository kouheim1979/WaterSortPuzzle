name: Deploy Water Sort Puzzle to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair known source issues
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          original = text

          broken_history = "steps.push({fi:pick.fi,ti:pick.count});prev=pick;"
          fixed_history = "steps.push({fi:pick.fi,ti:pick.ti,count:pick.count});prev=pick;"
          text = text.replace(broken_history, fixed_history, 1)

          broken_brace = "if(!best||score>best.score)best={...candidate,score}\n        }\n      }\n    }\n    return best"
          fixed_brace = "if(!best||score>best.score)best={...candidate,score}}\n        }\n      }\n    }\n    return best"
          text = text.replace(broken_brace, fixed_brace, 1)

          if text != original:
              path.write_text(text, encoding="utf-8")
              print("Repaired known StageManager source issues.")
          else:
              print("No known source repair was required.")

      - name: Extract inline JavaScript
        shell: python
        run: |
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          start = html.index("<script>") + len("<script>")
          end = html.index("</script>", start)
          Path("/tmp/app.js").write_text(html[start:end], encoding="utf-8")

      - name: JavaScript syntax check
        shell: bash
        run: node --check /tmp/app.js

      - name: Validate all fixed stages
        shell: python
        run: |
          from pathlib import Path
          js = Path("/tmp/app.js").read_text(encoding="utf-8")
          boot = "document.addEventListener('DOMContentLoaded',()=>new App().init(),{once:true});"
          smoke = "if(!StageManager.validateAllFixedStages())throw new Error('Fixed-stage validation failed');"
          if boot not in js:
              raise SystemExit("Boot marker not found")
          Path("/tmp/stage-smoke.js").write_text(js.replace(boot, smoke, 1), encoding="utf-8")

      - name: Run fixed-stage smoke test
        shell: bash
        run: node /tmp/stage-smoke.js

      - name: Persist source repair to main
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No source repair to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Fix JavaScript syntax and stage generation"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
