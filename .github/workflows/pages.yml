name: Deploy Water Sort Puzzle to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract inline JavaScript and syntax check
        run: node .github/scripts/validate.cjs --syntax-only

      - name: Fixed stages and game regression tests
        run: node .github/scripts/validate.cjs

      - name: Install browser test tools (CI only)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/watersort-browser" playwright@1.58.2
          node "$RUNNER_TEMP/watersort-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit

      - name: Chromium and WebKit mobile/desktop gameplay checks
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/watersort-browser/node_modules/playwright
        run: node .github/scripts/browser-check.cjs

      - name: Save browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: _browser-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare verified static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cmp index.html _site/index.html

      - name: Upload verified static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source for published verification
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Require the validated Actions publishing path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Set Settings > Pages > Source to GitHub Actions once as a maintainer.
          # GITHUB_TOKEN can deploy Pages, but cannot administer its settings.
          if ! build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type'); then
            echo '::error::Cannot read Pages configuration. Check that Pages is enabled and this job has pages: write.'
            exit 1
          fi
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Pages source is '$build_type'. In Settings > Pages > Build and deployment, set Source to GitHub Actions, then re-run this job. Repository settings cannot be changed by GITHUB_TOKEN."
            exit 1
          fi
          echo 'PASS Pages source: GitHub Actions (validated artifact publishing only).'

      - name: Deploy verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the published HTML matches this commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${PAGE_URL}?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/published.html && cmp --silent index.html /tmp/published.html; then
              sha256sum index.html /tmp/published.html
              node .github/scripts/validate.cjs /tmp/published.html
              exit 0
            fi
            echo "Waiting for the published HTML to match commit ${GITHUB_SHA} (attempt ${attempt}/12)."
            sleep 10
          done
          echo 'Published HTML does not match the validated source.' >&2
          exit 1
